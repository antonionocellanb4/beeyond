<!doctype html>
<html lang="en">
<head>

<style>
  /* standalone: no nav, so it cannot break when the shared header changes */
  .nf{min-height:100svh;display:grid;place-content:center;justify-items:start;
      gap:1.2rem;padding:8vw;background:var(--ink);color:var(--paper)}
  .nf h1{font-family:var(--font-head);font-size:clamp(3rem,12vw,9rem);line-height:.9;
         letter-spacing:-.04em;font-weight:600;margin:0}
  .nf p{max-width:34ch;color:var(--mute);margin:0}
  .nf a{color:var(--paper);text-decoration:none;border-bottom:2px solid var(--accent);padding-bottom:2px}
</style>
</head>
<body class="nf">
  <h1>404</h1>
  <p>That page is not here. It may have been renamed, or the link that sent you is out of date.</p>
  <p><a href="index.html">Back to the home page</a></p>
